name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ==========================================
  # Job 1: Docker 이미지 빌드 & GHCR 푸시
  # ==========================================
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yeahyak-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push ai
        uses: docker/build-push-action@v6
        with:
          context: ai
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yeahyak-ai:latest
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yeahyak-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ==========================================
  # Job 2: 서버 배포 (SSH)
  # ==========================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN
          script_stop: true
          script: |
            cd /opt/yeahyak
            git pull
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
